<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TourCerca · Panel del guía</title>
<meta name="description" content="Programá tus salidas, armá el recorrido y salí en vivo para que los turistas cercanos te encuentren.">
<meta name="theme-color" content="#F6C9D8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/tourcerca.css">
<style>
body{background:var(--pink-50)}
.g-top{position:sticky;top:0;height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);z-index:1000}
.g-top .logo{font-size:20px}
.g-top .spacer{flex:1}
.g-top .who{display:flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px 4px 4px;background:var(--pink-50);border:1px solid var(--line);font-weight:800;font-size:13px}
.g-top .who .avatar{width:32px;height:32px;font-size:12px;border-width:2px}
.btn-line{background:#fff;color:var(--pink-700);border:1.5px solid var(--pink-200)}
.btn-line:hover{background:var(--pink-50)}

.g-wrap{max-width:1000px;margin:0 auto;padding:22px 16px 70px}
.g-hello{display:flex;align-items:center;gap:16px;background:linear-gradient(150deg,var(--pink-100),var(--pink-300));border-radius:24px;padding:20px}
.g-hello .avatar{width:64px;height:64px;font-size:22px}
.g-hello h1{font-size:clamp(22px,3vw,28px);font-weight:900;letter-spacing:-.5px}
.g-hello p{color:var(--ink-2);font-weight:700;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{background:rgba(255,255,255,.75);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px}
.g-sec{margin-top:26px}
.g-sec>h2{font-size:19px;font-weight:900;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.g-sec>h2 small{font-size:13px;color:var(--ink-3);font-weight:800}
.empty-box{background:#fff;border:1.5px dashed var(--pink-300);border-radius:18px;padding:22px;text-align:center;color:var(--ink-2);font-weight:700}

.sal{display:flex;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;align-items:flex-start}
.sal .when{flex:0 0 76px;text-align:center;background:var(--pink-100);border-radius:14px;padding:9px 4px}
.sal .when small{display:block;font-size:11.5px;font-weight:900;color:var(--pink-700);text-transform:uppercase;letter-spacing:.3px}
.sal .when b{display:block;font-size:21px;font-weight:900;color:var(--ink)}
.sal .when i{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink-2)}
.sal.old{opacity:.65}
.sal .info{flex:1;min-width:0}
.sal h3{font-size:16px;font-weight:900;line-height:1.2}
.sal .meta{font-size:13px;color:var(--ink-2);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mini{border-radius:999px;padding:7px 12px;font-weight:900;font-size:12.5px;background:var(--pink-50);border:1.5px solid var(--line);color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini:hover{border-color:var(--pink-300)}
.mini.go{background:var(--pink-500);border-color:var(--pink-500);color:#fff}
.mini.go:hover{background:var(--pink-600)}
.mini.danger{color:var(--live)}
.livebar{display:flex;gap:12px;align-items:center;background:#FDE8E8;border:1.5px solid #F6C4C6;border-radius:18px;padding:14px;margin-top:16px}
.livebar .t{flex:1;font-weight:800;color:#8E1F24}
.livebar .t b{display:block;font-size:16px;font-weight:900}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tcard .em{font-size:30px;line-height:1}
.tcard h3{font-size:15.5px;font-weight:900;line-height:1.2;margin-top:6px}
.tcard .meta{font-size:12.5px;color:var(--ink-2);font-weight:700}
.tcard .acts{margin-top:auto;padding-top:8px}
.tcard.new{border-style:dashed;border-color:var(--pink-300);align-items:center;justify-content:center;text-align:center;color:var(--pink-600);font-weight:900;min-height:150px;background:rgba(255,255,255,.6);cursor:pointer;font-size:15px}
.tcard.new:hover{background:#fff}
.tcard.new span{font-size:34px}
.foot-tools{margin-top:34px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* login */
.login-hero{text-align:center;padding:36px 16px 10px}
.login-hero h1{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-1px}
.login-hero p{color:var(--ink-2);font-weight:700;max-width:560px;margin:8px auto 0}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:22px}
.gcard{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;transition:.15s}
.gcard:hover{border-color:var(--pink-300);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
.gcard b{display:block;font-weight:900;font-size:15px}
.gcard small{font-weight:700;color:var(--ink-2);font-size:12.5px}

/* editor */
.ed{display:grid;grid-template-columns:430px 1fr;height:calc(100dvh - 62px)}
.ed-form{overflow-y:auto;padding:18px 18px 0;background:#fff;border-right:1px solid var(--line)}
.ed-form h2{font-size:21px;font-weight:900;letter-spacing:-.4px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.ed-map{position:relative;min-height:300px}
.ed-map .mapbox{position:absolute;inset:0}
.field{margin-bottom:13px}
.field>label{display:block;font-size:12px;font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.row2c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.inp{resize:vertical;min-height:70px;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink-2);margin-top:7px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--pink-500)}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.stops{list-style:none}
.stops li{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.stops .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--pink-500);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center}
.stops .n.meet{background:var(--pink-700);font-size:14px}
.stops .inp{padding:8px 10px}
.stops .del{flex:0 0 32px;height:32px;border-radius:10px;background:var(--pink-50);border:1px solid var(--line);color:var(--ink-3);font-weight:900}
.stops .del:hover{color:var(--live)}
.stop-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.help{background:var(--pink-50);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.ed-actions{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 28%);padding:18px 0 18px;display:flex;gap:8px;margin-top:6px}
.ed-actions .btn{flex:1}
.map-tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:700;background:rgba(59,42,51,.86);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.snum{width:28px;height:28px;border-radius:50%;background:var(--pink-500);color:#fff;border:3px solid #fff;font-weight:900;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.snum.meet{background:var(--pink-700);width:34px;height:34px;font-size:15px}
.snum.done{background:var(--pink-300)}

/* en vivo */
.lv{position:relative;height:calc(100dvh - 62px)}
.lv .mapbox{position:absolute;inset:0}
.lv-card{position:absolute;left:12px;right:12px;margin:0 auto;max-width:540px;z-index:700;background:#fff;border-radius:22px;box-shadow:0 10px 34px rgba(158,68,104,.25);padding:14px 16px}
.lv-top{top:12px}
.lv-bot{bottom:12px}
.onair{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;border-radius:999px;padding:4px 11px;font-weight:900;font-size:12px;letter-spacing:.5px}
.onair .dot{background:#fff}
.lv-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:22px}
.lv-name{font-weight:900;font-size:16px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;background:var(--pink-50);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.next small{display:block;font-size:11.5px;font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.next b{font-weight:900;font-size:15px}
.gps{font-size:13px;font-weight:800;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lv-bot .opts{margin-top:10px}
.lv-bot .row{display:flex;gap:8px;margin-top:12px}
.lv-bot .row .btn{flex:1;padding:12px 10px;font-size:14.5px}
.btn-danger{background:#fff;color:var(--live);border:1.5px solid #F6C4C6}
.btn-danger:hover{background:#FDE8E8}
.res-list{list-style:none;margin-top:6px}
.res-list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:800}
.res-list li span{color:var(--ink-3);font-weight:700;font-size:13px}

@media (max-width:800px){
  .g-top{height:56px;padding:0 12px}
  .g-top .logo .txt,.g-top .who .nm,.g-top .lbl-long{display:none}
  .g-top .who{padding:3px}
  .ed{grid-template-columns:1fr;height:auto}
  .ed-map{order:-1;height:42vh;position:sticky;top:56px;z-index:5;border-bottom:1px solid var(--line)}
  .ed-form{border-right:0;overflow:visible}
  .lv{height:calc(100dvh - 56px)}
  .row2c.stack{grid-template-columns:1fr;gap:0}
  .sal .when{flex-basis:66px}
  .leaflet-control-zoom{display:none}
}
</style>
</head>
<body>

<header class="g-top">
  <a class="logo" href="index.html" title="Ir a la vista del turista"><span class="mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span><span class="brand"><span class="txt">Tour<b>Cerca</b></span></span></a>
  <span class="pill">🧭 <span class="lbl-long">Panel del </span>guía</span>
  <span class="spacer"></span>
  <a class="btn btn-line btn-sm" href="index.html#mapa" target="_blank" rel="noopener" title="Abrir la vista del turista en otra pestaña">👀 <span class="lbl-long">Ver como turista</span></a>
  <span id="who"></span>
</header>

<main id="view"></main>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/comun.js"></script>
<script src="js/store.js"></script>
<script>
/* =====================================================================
   PANEL DEL GUÍA
   Pantallas: elegir guía → mis salidas → programar salida → en vivo
   ===================================================================== */
const G_KEY = 'tourcerca.guia';
let guia = null;
try { guia = localStorage.getItem(G_KEY); } catch(e){}
if(!GUIDES[guia]) guia = null;

const view = document.getElementById('view');
let cleanup = null, curView = '';
function go(fn, arg){
  if(cleanup){ cleanup(); cleanup = null; }
  view.onclick = null;
  window.scrollTo(0,0);
  fn(arg);
  renderWho();
}

/* ---------- utilidades ---------- */
const avatar = (g, cls='') => `<span class="avatar ${cls}" style="background:${g.c}">${initials(g.n)}</span>`;
const pad = n => String(n).padStart(2,'0');
const toLocalInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function diaLabel(ms){
  const d = new Date(ms), t = new Date();
  const dd = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(t.getFullYear(),t.getMonth(),t.getDate())) / 864e5);
  return dd === 0 ? 'Hoy' : dd === 1 ? 'Mañana' : dd === -1 ? 'Ayer' : d.toLocaleDateString('es-AR',{weekday:'short', day:'numeric', month:'numeric'});
}
const misSalidas = () => Store.salidas().filter(s=>s.g === guia);
const misTours = () => TOURS.filter(t=>t.g === guia).map(t=>({...t, demo:true}))
  .concat(Object.values(Store.get().tours).filter(t=>t.g === guia));
const findMiTour = id => misTours().find(t=>String(t.id) === String(id));
const fromTour = t => ({name:t.name, cat:t.cat, desc:t.desc||'', price:t.price, dur:t.dur, cupos:t.cupos, langs:[...t.langs], route:t.route.map(r=>r.slice())});

function confirmBox(title, text, okLabel, danger){
  return new Promise(res=>{
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>
      <div style="display:flex;gap:8px"><button class="btn btn-ghost" style="flex:1;border:1.5px solid var(--line)" data-no>Volver</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" style="flex:1" data-yes>${esc(okLabel)}</button></div></div>`;
    ov.onclick = e=>{
      if(e.target === ov || e.target.hasAttribute('data-no')){ ov.remove(); res(false); }
      else if(e.target.hasAttribute('data-yes')){ ov.remove(); res(true); }
    };
    document.body.appendChild(ov);
  });
}
function openReservas(id){
  const s = Store.get().salidas[id]; if(!s) return;
  const rs = Store.reservasDe(id), tot = Store.ocupados(id);
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>👥 Reservas</h3>
    <p class="muted">${esc(s.name)} · ${diaLabel(s.startAt)} ${hhmm(s.startAt)} h · ${tot} de ${s.cupos} lugares</p>
    ${rs.length ? `<ul class="res-list">${rs.map(r=>`<li>${esc(r.name || 'Sin nombre')} <span>${r.qty} persona${r.qty>1?'s':''} · ${hhmm(r.ts)} h</span></li>`).join('')}</ul>`
      : `<div class="help">Todavía no hay reservas. Para probarlo, abrí <b>Ver como turista</b> en otra pestaña de este navegador, buscá esta salida y reservá.</div>`}
    <div style="margin-top:16px"><button class="btn btn-primary" style="width:100%" data-x>Cerrar</button></div></div>`;
  ov.onclick = e=>{ if(e.target === ov || e.target.hasAttribute('data-x')) ov.remove(); };
  document.body.appendChild(ov);
}

/* ---------- barra superior ---------- */
function renderWho(){
  const w = document.getElementById('who');
  if(!guia){ w.innerHTML = ''; return; }
  const g = GUIDES[guia];
  w.innerHTML = `<button class="who" title="Cambiar de guía (demo)">${avatar(g)}<span class="nm">${esc(g.n.split(' ')[0])}</span></button>`;
  w.firstChild.onclick = ()=> go(vLogin);
}

/* =====================================================================
   1) ELEGIR GUÍA (en la versión real: cuenta con usuario y contraseña)
   ===================================================================== */
function vLogin(){
  curView = 'login';
  view.innerHTML = `<div class="g-wrap">
    <div class="login-hero">
      <h1>Panel del guía</h1>
      <p>Programá tus salidas, armá el recorrido en el mapa y salí en vivo para que los turistas que están cerca te encuentren.</p>
    </div>
    <div class="help" style="text-align:center;margin-top:18px">Prototipo: elegí con qué guía de ejemplo querés entrar. En la versión final cada guía va a tener su propia cuenta.</div>
    <div class="gcards">${Object.entries(GUIDES).map(([id,g])=>`
      <button class="gcard" data-g="${id}">${avatar(g)}<span><b>${esc(g.n)}</b><small>⭐ ${g.r} · ${TOURS.filter(t=>t.g===id).length} tours</small></span></button>`).join('')}
    </div></div>`;
  view.onclick = e=>{
    const b = e.target.closest('[data-g]'); if(!b) return;
    guia = b.dataset.g;
    try { localStorage.setItem(G_KEY, guia); } catch(e){}
    go(vDash);
  };
}

/* =====================================================================
   2) MIS SALIDAS
   ===================================================================== */
function salCard(s){
  const T = Date.now(), m = Math.ceil((s.startAt - T)/MIN), ocup = Store.ocupados(s.id);
  const vencida = s.status !== 'en_curso' && T > s.startAt + 30*MIN;
  const cuando = s.status === 'en_curso' ? '<i style="color:var(--live)">EN VIVO</i>'
    : vencida ? '<i>no salió</i>' : m <= 0 ? '<i>¡ahora!</i>' : m <= 120 ? `<i>en ${fmtIn(m)}</i>` : '';
  return `<div class="sal ${vencida?'old':''}">
    <div class="when"><small>${diaLabel(s.startAt)}</small><b>${hhmm(s.startAt)}</b>${cuando}</div>
    <div class="info">
      <h3>${CATS[s.cat].e} ${esc(s.name)}</h3>
      <div class="meta"><span>📍 ${esc(s.route[0][2])}</span><span>⏱️ ${fmtIn(s.dur)}</span><span>👥 ${ocup}/${s.cupos} reservados</span><span>${money(s.price)}</span></div>
      <div class="acts">
        ${vencida ? '' : `<button class="mini go" data-act="start" data-id="${s.id}">▶ Empezar tour</button>`}
        <button class="mini" data-act="res" data-id="${s.id}">👥 Reservas</button>
        ${vencida ? '' : `<button class="mini" data-act="edit" data-id="${s.id}">✏️ Editar</button>`}
        <button class="mini danger" data-act="del" data-id="${s.id}">🗑 ${vencida?'Borrar':'Cancelar'}</button>
      </div>
    </div></div>`;
}
function vDash(){
  if(!guia) return vLogin();
  curView = 'dash';
  const g = GUIDES[guia], T = Date.now(), sal = misSalidas();
  const live = sal.find(s=>s.status === 'en_curso');
  const prox = sal.filter(s=>s.status !== 'en_curso' && s.status !== 'finalizada').sort((a,b)=>a.startAt - b.startAt);
  const hist = sal.filter(s=>s.status === 'finalizada').sort((a,b)=>b.endedAt - a.endedAt).slice(0,5);
  const reservas = prox.reduce((a,s)=>a + Store.ocupados(s.id), 0);
  const tours = misTours();

  view.innerHTML = `<div class="g-wrap">
    <div class="g-hello">${avatar(g)}<div>
      <h1>Hola, ${esc(g.n.split(' ')[0])} 👋</h1>
      <p>${esc(g.bio)}</p>
      <div class="stats"><span class="stat">📅 ${prox.length} salida${prox.length===1?'':'s'} programada${prox.length===1?'':'s'}</span><span class="stat">👥 ${reservas} reserva${reservas===1?'':'s'}</span><span class="stat">⭐ ${g.r} (${g.rv})</span></div>
    </div></div>

    ${live ? `<div class="livebar"><span class="onair"><span class="dot"></span> EN VIVO</span>
      <div class="t"><b>${esc(live.name)}</b>Los turistas te están viendo en el mapa.</div>
      <button class="btn btn-primary btn-sm" data-act="resume" data-id="${live.id}">Volver al tour</button></div>` : ''}

    <section class="g-sec">
      <h2>Próximas salidas <button class="mini go" data-act="new">＋ Programar salida</button></h2>
      ${prox.length ? prox.map(salCard).join('') : `<div class="empty-box">Todavía no programaste salidas.<br>Elegí uno de tus tours de abajo y tocá <b>Programar</b>, o <b>▶ Salir ahora</b> para probar el modo en vivo.</div>`}
    </section>

    <section class="g-sec">
      <h2>Mis tours <small>${tours.length}</small></h2>
      <div class="tgrid">
        ${tours.map(t=>`<div class="tcard">
          <span class="em">${CATS[t.cat].e}</span>
          <h3>${esc(t.name)}</h3>
          <span class="meta">📍 ${esc(t.route[0][2])}</span>
          <span class="meta">⏱️ ${fmtIn(t.dur)} · ${money(t.price)} · ${t.route.length} paradas</span>
          <div class="acts">
            <button class="mini go" data-act="prog" data-id="${t.id}">📅 Programar</button>
            <button class="mini" data-act="now" data-id="${t.id}">▶ Salir ahora</button>
            ${t.demo ? '' : `<button class="mini danger" data-act="deltour" data-id="${t.id}" title="Borrar tour">🗑</button>`}
          </div></div>`).join('')}
        <button class="tcard new" data-act="new"><span>＋</span>Crear un tour nuevo</button>
      </div>
    </section>

    ${hist.length ? `<section class="g-sec"><h2>Últimos tours realizados</h2>
      ${hist.map(s=>`<div class="sal old"><div class="when"><small>${diaLabel(s.startedAt||s.startAt)}</small><b>${hhmm(s.startedAt||s.startAt)}</b><i>finalizado</i></div>
        <div class="info"><h3>${CATS[s.cat].e} ${esc(s.name)}</h3><div class="meta"><span>👥 ${Store.ocupados(s.id)} reservas</span>${s.endedAt&&s.startedAt?`<span>⏱️ duró ${fmtIn(Math.max(1,Math.round((s.endedAt-s.startedAt)/MIN)))}</span>`:''}</div>
        <div class="acts"><button class="mini" data-act="res" data-id="${s.id}">👥 Reservas</button><button class="mini danger" data-act="del" data-id="${s.id}">🗑 Borrar</button></div></div></div>`).join('')}
    </section>` : ''}

    <div class="foot-tools">
      <a class="mini" href="index.html#mapa" target="_blank" rel="noopener">👀 Abrir la vista del turista</a>
      <button class="mini danger" data-act="reset">🧹 Borrar datos de prueba</button>
    </div>
  </div>`;

  view.onclick = async e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    const id = b.dataset.id, s = id ? Store.get().salidas[id] : null;
    switch(b.dataset.act){
      case 'new': return go(vEditor, {});
      case 'prog': return go(vEditor, {tourId:id});
      case 'edit': return go(vEditor, {salidaId:id});
      case 'res': return openReservas(id);
      case 'resume': return go(vLive, id);
      case 'start': {
        if(live && live.id !== id) return toast({ic:'⚠️', title:'Ya tenés un tour en vivo', text:'Finalizalo antes de empezar otro.'});
        return go(vLive, id);
      }
      case 'now': {
        if(live) return toast({ic:'⚠️', title:'Ya tenés un tour en vivo', text:'Finalizalo antes de empezar otro.'});
        const t = findMiTour(id); if(!t) return;
        const nueva = Store.guardarSalida({...fromTour(t), g:guia, barrio:nearestBarrio(t.route[0]), startAt:Date.now(), status:'programada', createdAt:Date.now()});
        return go(vLive, nueva.id);
      }
      case 'del': {
        const n = Store.ocupados(id);
        const ok = await confirmBox(s.status === 'finalizada' ? 'Borrar del historial' : 'Cancelar salida',
          n && s.status !== 'finalizada' ? `Esta salida tiene ${n} persona${n>1?'s':''} con reserva. Se van a quedar sin su lugar.` : `"${s.name}" deja de aparecer en el mapa de los turistas.`,
          s.status === 'finalizada' ? 'Borrar' : 'Cancelar salida', true);
        if(ok){ Store.borrarSalida(id); toast({ic:'🗑', title:'Listo', text:'La salida se quitó.'}); }
        return;
      }
      case 'deltour': {
        const t = findMiTour(id);
        if(t && await confirmBox('Borrar tour', `"${t.name}" se borra de tus tours. Las salidas ya programadas no se tocan.`, 'Borrar', true)) Store.borrarTour(id);
        return;
      }
      case 'reset': {
        if(await confirmBox('Borrar datos de prueba', 'Se borran todas las salidas, tours creados y reservas guardadas en este navegador. Los tours de ejemplo quedan.', 'Borrar todo', true)){
          Store.borrarTodo(); toast({ic:'🧹', title:'Datos borrados', text:'Quedó todo como recién instalado.'});
        }
        return;
      }
    }
  };
}

/* =====================================================================
   3) PROGRAMAR / EDITAR SALIDA (con recorrido en el mapa)
   ===================================================================== */
async function nombreDe(ll){
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=es&lat=${ll[0].toFixed(6)}&lon=${ll[1].toFixed(6)}`);
    const j = await r.json(), a = j.address || {};
    if(j.name && j.name !== a.road) return j.name;
    if(a.road) return a.road + (a.house_number ? ' ' + a.house_number : '');
  } catch(e){}
  return null;
}
function vEditor({salidaId, tourId} = {}){
  curView = 'editor';
  const existente = salidaId ? Store.get().salidas[salidaId] : null;
  const base = existente || (tourId ? findMiTour(tourId) : null);
  const d = base ? fromTour(base) : {name:'', cat:'historico', desc:'', price:15000, dur:90, cupos:15, langs:['ES'], route:[]};
  const start = existente ? existente.startAt : Math.ceil((Date.now() + 30*MIN) / (5*MIN)) * 5*MIN;
  const route = d.route;           // [lat, lng, nombre]
  const esNuevo = !base;
  const LANGS = ['ES','EN','PT','FR','IT','DE'];

  view.innerHTML = `<div class="ed">
    <div class="ed-form">
      <h2><button class="icon-btn" data-act="back" aria-label="Volver">←</button>${existente ? 'Editar salida' : 'Programar salida'}</h2>
      <div class="field"><label>Nombre del tour</label><input class="inp" id="fName" maxlength="70" placeholder="Ej: Secretos de San Telmo" value="${esc(d.name)}"></div>
      <div class="row2c stack">
        <div class="field"><label>Categoría</label><select class="inp" id="fCat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${k===d.cat?'selected':''}>${c.e} ${c.n}</option>`).join('')}</select></div>
        <div class="field"><label>Día y hora</label><input class="inp" type="datetime-local" id="fStart" value="${toLocalInput(start)}"></div>
      </div>
      <div class="row2c">
        <div class="field"><label>Duración (min)</label><input class="inp" type="number" id="fDur" min="15" max="600" step="5" value="${d.dur}"></div>
        <div class="field"><label>Cupos</label><input class="inp" type="number" id="fCupos" min="1" max="200" value="${d.cupos}"></div>
      </div>
      <div class="field"><label>Precio por persona ($)</label>
        <input class="inp" type="number" id="fPrice" min="0" step="500" value="${d.price || ''}" ${d.price===0?'disabled':''} placeholder="Ej: 15000">
        <label class="check"><input type="checkbox" id="fGorra" ${d.price===0?'checked':''}> A la gorra (cada uno paga lo que quiere)</label></div>
      <div class="field"><label>Idiomas</label><div class="langs" id="fLangs">${LANGS.map(l=>`<button type="button" class="chip ${d.langs.includes(l)?'on':''}" data-l="${l}">${l}</button>`).join('')}</div></div>
      <div class="field"><label>De qué se trata</label><textarea class="inp" id="fDesc" maxlength="400" placeholder="Contá en dos líneas qué van a ver y por qué vale la pena.">${esc(d.desc)}</textarea></div>
      <div class="field"><label>Recorrido</label>
        <div class="help">👆 Tocá el mapa para marcar el <b>punto de encuentro</b> y después cada <b>parada</b> en orden. Podés arrastrar los puntos y cambiarles el nombre.</div>
        <ul class="stops" id="fStops"></ul>
        <div class="stop-tools"><button type="button" class="mini" data-act="myloc">📍 Usar mi ubicación como encuentro</button><button type="button" class="mini" data-act="undo">↶ Deshacer última</button></div>
      </div>
      ${esNuevo ? `<label class="check" style="margin-bottom:6px"><input type="checkbox" id="fTpl" checked> Guardarlo también en "Mis tours" para repetirlo</label>` : ''}
      <div class="ed-actions"><button class="btn btn-ghost" style="border:1.5px solid var(--line)" data-act="back">Cancelar</button><button class="btn btn-primary" data-act="save">${existente ? 'Guardar cambios' : '📣 Publicar salida'}</button></div>
    </div>
    <div class="ed-map"><div class="mapbox" id="emap"></div><div class="map-tip" id="eTip"></div></div>
  </div>`;

  // ---- mapa ----
  const map = L.map('emap', {zoomControl:false}).setView(BARRIOS[(TOURS.find(t=>t.g===guia)||{}).barrio || 'Microcentro'].c, 15);
  L.control.zoom({position:'bottomright'}).addTo(map);
  baseTiles().addTo(map);
  const layer = L.layerGroup().addTo(map);
  const tip = document.getElementById('eTip');
  const defName = i => i === 0 ? 'Punto de encuentro' : `Parada ${i}`;

  function drawMap(){
    layer.clearLayers();
    if(route.length > 1){
      const ll = route.map(r=>[r[0],r[1]]);
      L.polyline(ll,{color:'#fff',weight:9,opacity:.9}).addTo(layer);
      L.polyline(ll,{color:'#E07FA3',weight:5,dashArray:'2 10',lineCap:'round'}).addTo(layer);
    }
    route.forEach((r,i)=>{
      const m = L.marker([r[0],r[1]], {draggable:true, icon:L.divIcon({className:'', html:`<div class="snum ${i===0?'meet':''}">${i===0?'★':i}</div>`, iconSize:i===0?[34,34]:[28,28], iconAnchor:i===0?[17,17]:[14,14]})})
        .addTo(layer).bindTooltip(esc(r[2]), {direction:'top', offset:[0,-14]});
      m.on('dragend', ()=>{ const p = m.getLatLng(); r[0] = p.lat; r[1] = p.lng; drawMap(); });
    });
    tip.textContent = route.length === 0 ? '👆 Tocá el mapa para marcar el punto de encuentro'
      : route.length === 1 ? '👆 Ahora tocá la primera parada' : `${route.length - 1} parada${route.length>2?'s':''} · ${fmtDist(prepTour({route}).len)} a pie`;
  }
  function drawList(){
    document.getElementById('fStops').innerHTML = route.map((r,i)=>`<li>
      <span class="n ${i===0?'meet':''}">${i===0?'★':i}</span>
      <input class="inp" data-i="${i}" maxlength="60" value="${esc(r[2])}">
      <button type="button" class="del" data-act="delstop" data-i="${i}" title="Quitar">✕</button></li>`).join('')
      || '<li style="color:var(--ink-3);font-weight:700;font-size:14px">Todavía no marcaste puntos.</li>';
  }
  async function addStop(ll){
    const entry = [ll[0], ll[1], defName(route.length)];
    route.push(entry); drawMap(); drawList();
    const nm = await nombreDe(ll);
    if(nm && route.includes(entry) && entry[2] === defName(route.indexOf(entry))){
      entry[2] = nm; drawMap(); drawList();
    }
  }
  map.on('click', e=> addStop([e.latlng.lat, e.latlng.lng]));
  drawMap(); drawList();
  setTimeout(()=>{
    map.invalidateSize();
    if(route.length) map.fitBounds(L.latLngBounds(route.map(r=>[r[0],r[1]])).pad(.3));
  }, 80);

  document.getElementById('fStops').addEventListener('input', e=>{
    const i = e.target.dataset.i; if(i == null) return;
    route[+i][2] = e.target.value; drawMap();
  });
  document.getElementById('fGorra').onchange = e=>{ const p = document.getElementById('fPrice'); p.disabled = e.target.checked; if(!e.target.checked && !p.value) p.value = 15000; };
  document.getElementById('fLangs').onclick = e=>{ const b = e.target.closest('[data-l]'); if(b) b.classList.toggle('on'); };

  view.onclick = async e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    switch(b.dataset.act){
      case 'back': return go(vDash);
      case 'undo': route.pop(); drawMap(); drawList(); return;
      case 'delstop': {
        route.splice(+b.dataset.i, 1);
        route.forEach((r,i)=>{ if(/^(Punto de encuentro|Parada \d+)$/.test(r[2])) r[2] = defName(i); });
        drawMap(); drawList(); return;
      }
      case 'myloc': {
        if(!navigator.geolocation) return toast({ic:'📍', title:'Sin GPS', text:'Este navegador no comparte la ubicación. Marcalo tocando el mapa.'});
        navigator.geolocation.getCurrentPosition(async p=>{
          const ll = [p.coords.latitude, p.coords.longitude];
          if(distM(ll, OBELISCO) > 25000) return toast({ic:'📍', title:'Estás lejos de Buenos Aires', text:'Marcá el punto de encuentro tocando el mapa.'});
          const entry = [ll[0], ll[1], 'Punto de encuentro'];
          if(route.length) route[0] = entry; else route.push(entry);
          drawMap(); drawList(); map.setView(ll, 16);
          const nm = await nombreDe(ll); if(nm && route[0] === entry){ entry[2] = nm; drawMap(); drawList(); }
        }, ()=> toast({ic:'📍', title:'No pudimos obtener tu ubicación', text:'Marcá el punto de encuentro tocando el mapa.'}), {enableHighAccuracy:true, timeout:8000});
        return;
      }
      case 'save': {
        const name = document.getElementById('fName').value.trim();
        const startAt = new Date(document.getElementById('fStart').value).getTime();
        const gorra = document.getElementById('fGorra').checked;
        const price = gorra ? 0 : Math.max(0, Math.round(+document.getElementById('fPrice').value || 0));
        const dur = Math.max(15, Math.round(+document.getElementById('fDur').value || 0));
        const cupos = Math.max(1, Math.round(+document.getElementById('fCupos').value || 0));
        const langs = [...document.querySelectorAll('#fLangs .chip.on')].map(x=>x.dataset.l);
        const err = !name ? 'Ponele un nombre al tour.'
          : !route.length ? 'Marcá en el mapa al menos el punto de encuentro.'
          : isNaN(startAt) ? 'Elegí el día y la hora.'
          : (!existente || existente.startAt !== startAt) && startAt < Date.now() - 5*MIN ? 'La hora de salida ya pasó. Elegí una hora futura.'
          : !langs.length ? 'Elegí al menos un idioma.' : '';
        if(err) return toast({ic:'✋', title:'Falta algo', text:err});
        route.forEach((r,i)=>{ if(!r[2].trim()) r[2] = defName(i); });
        const datos = {name, cat:document.getElementById('fCat').value, desc:document.getElementById('fDesc').value.trim(), price, dur, cupos, langs, route:route.map(r=>[+r[0].toFixed(6), +r[1].toFixed(6), r[2].trim()])};
        if(esNuevo && document.getElementById('fTpl')?.checked) Store.guardarTour({...datos, g:guia});
        Store.guardarSalida({...(existente||{}), ...datos, g:guia, barrio:nearestBarrio(datos.route[0]), startAt, status:existente?.status || 'programada', createdAt:existente?.createdAt || Date.now()});
        go(vDash);
        toast({ic:'📣', title: existente ? 'Cambios guardados' : '¡Salida publicada!', text:`Los turistas cerca de ${datos.route[0][2]} ya la ven en el mapa.`});
        return;
      }
    }
  };
  cleanup = ()=> map.remove();
}

/* =====================================================================
   4) EN VIVO: comparte la ubicación del guía
   ===================================================================== */
function vLive(id){
  let sal = Store.get().salidas[id];
  if(!sal) return go(vDash);
  if(sal.status !== 'en_curso'){ Store.iniciar(id, sal.route[0].slice(0,2)); sal = Store.get().salidas[id]; }
  curView = 'live';
  const t = prepTour({...sal, route:sal.route.map(r=>r.slice())});
  const last = t.route.length - 1;
  const stopDist = i => i <= 0 ? 0 : t.segs[i-1].from + t.segs[i-1].len;
  const lv0 = Store.get().live[id] || {};
  let stop = lv0.stop || 0, pos = lv0.ll || t.route[0].slice(0,2), mode = lv0.mode === 'sim' ? 'sim' : 'gps';
  let simSpeed = 5, simDist = stopDist(stop), acc = null, watchId = null, simTimer = null, lastPush = 0, wake = null, followMe = true;
  const g = GUIDES[guia];

  view.innerHTML = `<div class="lv">
    <div class="mapbox" id="lmap"></div>
    <div class="lv-card lv-top">
      <div class="lv-head"><span class="onair"><span class="dot"></span> EN VIVO</span><span class="timer" id="lTimer">00:00</span></div>
      <div class="lv-name">${CATS[t.cat].e} ${esc(t.name)}</div>
      <div class="next"><div><small id="lNextLbl">Próxima parada</small><b id="lNext">—</b></div><button class="btn btn-primary btn-sm" data-act="arrive" id="lArrive">✓ Llegamos</button></div>
    </div>
    <div class="lv-card lv-bot">
      <div class="gps"><span id="lGps">📡 Buscando GPS…</span><span id="lRes"></span></div>
      <div class="opts" id="lModes"></div>
      <div class="row"><button class="btn btn-line" data-act="back">← Mis salidas</button><button class="btn btn-danger" data-act="end">■ Finalizar tour</button></div>
    </div>
  </div>`;

  const map = L.map('lmap', {zoomControl:false}).setView(pos, 17);
  baseTiles().addTo(map);
  const ll = t.route.map(r=>[r[0],r[1]]);
  if(ll.length > 1){
    L.polyline(ll,{color:'#fff',weight:9,opacity:.9}).addTo(map);
    L.polyline(ll,{color:'#E07FA3',weight:5,dashArray:'2 10',lineCap:'round'}).addTo(map);
  }
  const stopMk = t.route.map((r,i)=> L.marker([r[0],r[1]], {icon:L.divIcon({className:'', html:`<div class="snum ${i===0?'meet':''}">${i===0?'★':i}</div>`, iconSize:[30,30], iconAnchor:[15,15]})}).addTo(map).bindTooltip(esc(r[2])));
  const me = L.marker(pos, {zIndexOffset:1000, icon:L.divIcon({className:'guide-icon', html:`<div class="gmk"><div class="ring"></div><div class="av" style="background:${g.c}">${initials(g.n)}</div><span class="live-l">VOS</span></div>`, iconSize:[46,46], iconAnchor:[23,23]})}).addTo(map);
  map.on('dragstart', ()=> followMe = false);
  setTimeout(()=>map.invalidateSize(), 50);

  function push(force){
    const T = Date.now();
    if(force || T - lastPush > 2000){ lastPush = T; Store.posicion(id, {ll:pos, stop, mode}); }
  }
  function paintStops(){
    stopMk.forEach((m,i)=>{ const el = m.getElement()?.querySelector('.snum'); if(el) el.classList.toggle('done', i <= stop && i > 0); });
  }
  function ui(){
    const el = Math.max(0, Date.now() - sal.startedAt), h = Math.floor(el/36e5), m = Math.floor(el/6e4)%60, s = Math.floor(el/1e3)%60;
    document.getElementById('lTimer').textContent = (h ? h + ':' : '') + pad(m) + ':' + pad(s);
    if(stop < last){
      const nx = t.route[stop+1];
      document.getElementById('lNextLbl').textContent = `Próxima parada · ${stop+1} de ${last}`;
      document.getElementById('lNext').textContent = `${nx[2]} · ${fmtDist(distM(pos, nx))}`;
      document.getElementById('lArrive').hidden = false;
    } else {
      document.getElementById('lNextLbl').textContent = last ? 'Recorrido completo' : 'Tour sin paradas';
      document.getElementById('lNext').textContent = '¡Llegaste al final! 🎉';
      document.getElementById('lArrive').hidden = true;
    }
    document.getElementById('lGps').textContent = mode === 'gps' ? `📡 GPS real${acc ? ` · precisión ${Math.round(acc)} m` : ''}` : `🧪 Simulando caminata ×${simSpeed}`;
    const n = Store.ocupados(id);
    document.getElementById('lRes').textContent = `👥 ${n} reserva${n===1?'':'s'}`;
    paintStops();
  }
  function setPos(p){
    pos = p; me.setLatLng(p);
    if(followMe) map.panTo(p, {animate:true, duration:.8});
    if(mode === 'gps' && stop < last && distM(pos, t.route[stop+1]) < 35){
      stop++; toast({ic:'📍', title:`Llegaste a ${t.route[stop][2]}`, text: stop < last ? `Próxima: ${t.route[stop+1][2]}` : 'Era la última parada.'});
    }
    push(); ui();
  }
  function modesUI(){
    document.getElementById('lModes').innerHTML = `<button class="chip ${mode==='gps'?'on':''}" data-mode="gps">📡 GPS real</button><button class="chip ${mode==='sim'?'on':''}" data-mode="sim">🧪 Simular caminata</button>`
      + (mode === 'sim' ? [1,5,20].map(v=>`<button class="chip ${simSpeed===v?'on':''}" data-speed="${v}">×${v}</button>`).join('') : '')
      + (!followMe ? '<button class="chip" data-act="follow">🎯 Seguirme</button>' : '');
  }
  function stopAll(){
    if(watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    if(simTimer){ clearInterval(simTimer); simTimer = null; }
  }
  function startSim(why){
    stopAll(); mode = 'sim'; modesUI();
    if(why) toast({ic:'🧪', title:'Modo simulación', text:why});
    simDist = Math.max(simDist, stopDist(stop));
    simTimer = setInterval(()=>{
      if(t.len <= 0) return;
      simDist = Math.min(t.len, simDist + 1.25 * simSpeed);        // 1,25 m/s ≈ 4,5 km/h
      while(stop < last && stopDist(stop+1) <= simDist + .5) stop++;
      setPos(pointAlong(t, simDist / t.len).ll);
    }, 1000);
    push(true); ui();
  }
  function startGPS(){
    stopAll(); mode = 'gps'; modesUI(); ui();
    if(!navigator.geolocation) return startSim('Este navegador no comparte la ubicación, así que simulamos la caminata.');
    watchId = navigator.geolocation.watchPosition(p=>{
      const ll = [p.coords.latitude, p.coords.longitude];
      if(distM(ll, OBELISCO) > 25000) return startSim('Estás lejos de Buenos Aires: simulamos la caminata por el recorrido.');
      acc = p.coords.accuracy; setPos(ll);
    }, ()=> startSim('No pudimos usar el GPS: simulamos la caminata por el recorrido.'), {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
  }

  // mantener la pantalla encendida mientras dura el tour (si el navegador lo permite)
  (async()=>{ try { wake = await navigator.wakeLock?.request('screen'); } catch(e){} })();
  const onVis = async()=>{ if(document.visibilityState === 'visible' && (!wake || wake.released)){ try { wake = await navigator.wakeLock?.request('screen'); } catch(e){} } };
  document.addEventListener('visibilitychange', onVis);
  const clock = setInterval(ui, 1000);

  view.onclick = async e=>{
    const m = e.target.closest('[data-mode]');
    if(m){ return m.dataset.mode === 'sim' ? startSim() : startGPS(); }
    const sp = e.target.closest('[data-speed]');
    if(sp){ simSpeed = +sp.dataset.speed; modesUI(); ui(); return; }
    const b = e.target.closest('[data-act]'); if(!b) return;
    switch(b.dataset.act){
      case 'follow': followMe = true; map.panTo(pos); modesUI(); return;
      case 'arrive':
        if(stop >= last) return;
        stop++;
        if(mode === 'sim'){ simDist = stopDist(stop); pos = t.route[stop].slice(0,2); me.setLatLng(pos); map.panTo(pos); }
        push(true); ui(); return;
      case 'back': return go(vDash);
      case 'end':
        if(await confirmBox('Finalizar tour', 'Dejás de compartir tu ubicación y el tour desaparece del mapa de los turistas.', 'Finalizar', true)){
          Store.finalizar(id); go(vDash);
          toast({ic:'🎉', title:'¡Tour finalizado!', text:'Gracias por guiar con TourCerca.'});
        }
        return;
    }
  };
  map.on('dragstart', modesUI);

  cleanup = ()=>{
    stopAll(); clearInterval(clock);
    document.removeEventListener('visibilitychange', onVis);
    try { wake?.release(); } catch(e){}
    map.remove();
  };
  mode === 'sim' ? startSim() : startGPS();
  push(true);
}

/* ---------- cambios desde otra pestaña (reservas nuevas, etc.) ---------- */
let prevRes = Store.get().reservas.length;
Store.on(()=>{
  const rs = Store.get().reservas;
  if(rs.length > prevRes && guia){
    const r = rs[rs.length - 1], s = Store.get().salidas[r.salidaId];
    if(s && s.g === guia) toast({ic:'🎟️', title:'¡Nueva reserva!', text:`${r.name || 'Alguien'} reservó ${r.qty} lugar${r.qty>1?'es':''} para "${s.name}".`});
  }
  prevRes = rs.length;
  if(curView === 'dash') vDash();      // refresca contadores
});

mountVersion();
go(guia ? vDash : vLogin);
</script>
</body>
</html>
